<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Capsid Symmetry Tool</title>
    <meta name="description" content="Residues at the 5-fold and 3-fold symmetry axes of icosahedral virus capsids. Siddhant Raj Naik, KSBS, IIT Delhi." />
    <link rel="icon" href="gate_icon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
    <style>
      #loading { font-family: "Segoe UI", sans-serif; color: #1b2a3a; max-width: 720px; margin: 12vh auto; text-align: center; }
      #loading small { color: #5b7189; }
      #visitors { position: fixed; right: 12px; bottom: 10px; z-index: 1000; line-height: 0; }
    </style>
  </head>
  <body>
    <!-- visitor counter: loaded once per page visit, outside the app so clicks inside it don't add to the count -->
    <a id="visitors" href="https://hits.sh/siddhantrajnaik.github.io/capsid-symmetry-tool/" target="_blank" rel="noopener">
      <img src="https://hits.sh/siddhantrajnaik.github.io/capsid-symmetry-tool.svg?label=visitors&color=1d5fa8&labelColor=5b7189" alt="visitors" />
    </a>
    <div id="root">
      <div id="loading">
        <img src="gate_icon.png" width="96" alt="" /><h2>Capsid Symmetry Tool</h2>
        <p>Loading. The first visit takes about a minute because Python runs inside your browser.</p>
        <small>Siddhant Raj Naik, Kusuma School of Biological Sciences, IIT Delhi</small>
      </div>
    </div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
      const files = ["app.py", "gate_plots.py", "gate_compare.py", "gate_stemleaf.py", "gate_chemistry.py", "viewer3d.py", "gate_residues.sqlite"];
      mount(
        {
          requirements: ["numpy", "pandas", "matplotlib", "scipy", "statsmodels"],
          entrypoint: "app.py",
          streamlitConfig: { "theme.base": "light", "theme.primaryColor": "#1d5fa8", "client.toolbarMode": "viewer" },
          files: Object.fromEntries(files.map((f) => [f, { url: "./" + f }])),
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
